[project]
name = "openfarm-api"
version = "0.1.0"
description = "OpenFarm API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.0.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "shapely>=2.0.0",
    "geojson>=3.0.0",
    "pyproj>=3.6.0",
    "redis>=5.0.0",
    "pystac-client>=0.7.0",
    "rasterio>=1.3.0",
    "rio-cogeo>=5.0.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "owslib>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
